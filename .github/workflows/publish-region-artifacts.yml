name: Publish region artifacts

# Publica ZIPs ya construidos (artifacts de runs previos) al release
# rosteoman/RoadScout-regions sin reconstruir. Gratis en repo público.

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: "Lista run_id:artifact_name separados por coma (p.ej. 123:region-kansai-v9,456:region-kanto-v9)"
        required: true
        type: string

env:
  PACKAGE_VERSION: "9"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts from prior runs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          mkdir -p publish-zips
          IFS=',' read -ra items <<< "$ARTIFACTS"
          for item in "${items[@]}"; do
            item=$(echo "$item" | tr -d ' ')
            [ -n "$item" ] || continue
            run_id="${item%%:*}"
            name="${item#*:}"
            echo "Descargando $name desde run $run_id ..."
            dest=$(mktemp -d)
            gh run download "$run_id" --repo "${{ github.repository }}" -n "$name" -D "$dest"
            find "$dest" -type f -name "*-v${PACKAGE_VERSION}.zip" -exec cp -v {} publish-zips/ \;
          done
          ls -lh publish-zips
          test "$(find publish-zips -name '*.zip' | wc -l)" -gt 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge index.json
        env:
          GH_TOKEN: ${{ secrets.REGIONS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Falta el secret REGIONS_RELEASE_TOKEN"
            exit 1
          fi
          python3 scripts/merge_region_index.py \
            --zips-dir publish-zips \
            --out publish-zips/index.json \
            --version "${PACKAGE_VERSION}"

      - name: Upload to RoadScout-regions release
        env:
          GH_TOKEN: ${{ secrets.REGIONS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view regiones --repo rosteoman/RoadScout-regions >/dev/null 2>&1; then
            gh release create regiones \
              --repo rosteoman/RoadScout-regions \
              --title "Regiones" \
              --notes "Paquetes de carreteras por región. La app descarga el zip de la región elegida."
          fi
          gh release upload regiones \
            --repo rosteoman/RoadScout-regions \
            --clobber \
            publish-zips/index.json \
            publish-zips/*-v${PACKAGE_VERSION}.zip

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: region-index-v${{ env.PACKAGE_VERSION }}
          path: publish-zips/index.json
          if-no-files-found: error
          retention-days: 7
